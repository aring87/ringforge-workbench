# Builds the frozen workbench and attaches it to a GitHub Release.
#
# **Windows only, and for a stronger reason than the suite.** `tests.yml`
# builds on Windows because the engine shells out to Procmon and reads
# `ctypes.windll`. A PyInstaller bundle goes further than that: it is a Windows
# PE containing a Windows Python and Windows extension modules. There is no
# such thing as cross-building it.
#
# **What this ships and what it does not.** The engine, the GUI and the data
# under `ringforge/_data/`. Procmon, Autorunsc, Sysmon, FLOSS, capa, FakeNet
# and the downloaded YARA set are not redistributable and are not here --
# `scripts/bootstrap_tools.ps1` installs them into `tools/` beside the
# executable, and their absence keeps being reported as a coverage gap.
#
# The binary is unsigned. SmartScreen will warn, and a malware-analysis tool
# that bundles YARA trips a fair number of AV heuristics. Signing needs a
# certificate this workflow does not have.
name: release

on:
  push:
    tags: ["v*"]
  # So a build can be exercised without cutting a tag. Uploads the artifact
  # and creates no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build the executable (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and the packaging toolchain
        # `dev` carries pytest. Without it the suite step below fails on
        # "No module named pytest", which is what failed the v1.12.0 tag.
        # `lief` is not a declared dependency -- it is optional and lives in
        # `requirements.txt` -- but `lief_meta` is a shipped pipeline module and
        # a local build picks lief up from the bench. Installing it explicitly
        # keeps a CI bundle equal to a local one; divergent bundles from one
        # spec is the failure that got `capa-rules` dropped.
        run: python -m pip install -e ".[dev,gui]" lief pyinstaller==6.15.0

      # The suite before the build, not after. A bundle of code that does not
      # pass its own tests is not worth the four minutes it takes to freeze.
      - name: Run the suite
        run: python -m pytest -m "not slow" -q

      # ---------------------------------------------------------------------
      # The two external tools that may legally be redistributed.
      # ---------------------------------------------------------------------
      # capa and FLOSS are Apache-2.0, so they ship inside the zip and the
      # workbench works out of the box for capability detection and string
      # decoding. Everything else it drives -- Procmon, Autorunsc, Sysmon,
      # Npcap -- may not be redistributed at all, and the user installs those
      # via docs/TOOL_SETUP.md.
      #
      # Fetched rather than committed, because a 30 MB binary per tool does not
      # belong in git.
      #
      # **The release archives do not contain a licence file.** Both are just
      # the executable. Apache-2.0 requires a copy of the licence accompany a
      # redistributed binary, so the licence is fetched separately from the
      # repository root -- an earlier version of this step assumed the archive
      # carried it and would have failed every release build on its own check.
      - name: Vendor capa and FLOSS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-Tool($repo, $dest, $match) {
            # Resolve rather than pin: a hardcoded version that 404s breaks
            # every release build. What actually ships is recorded below.
            $rel = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
            $asset = $rel.assets | Where-Object { $_.name -match $match } | Select-Object -First 1
            if (-not $asset) { throw "no asset matching $match in $repo $($rel.tag_name)" }

            $zip = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force

            # Some archives nest everything one level down; flatten it so the
            # executable sits where the workbench looks for it.
            $inner = Get-ChildItem $dest -Directory
            if ($inner.Count -eq 1 -and -not (Get-ChildItem $dest -File)) {
              Get-ChildItem $inner[0].FullName | Move-Item -Destination $dest -Force
              Remove-Item $inner[0].FullName -Recurse -Force
            }

            # The licence, from the repository rather than the archive.
            $root = gh api "repos/$repo/contents/" | ConvertFrom-Json
            foreach ($f in $root | Where-Object { $_.name -match "(?i)^(license|licence|notice|copying)" }) {
              Invoke-WebRequest -Uri $f.download_url -OutFile (Join-Path $dest $f.name)
            }

            $licensed = Get-ChildItem $dest -File |
                        Where-Object { $_.Name -match "(?i)license|copying|notice" }
            if (-not $licensed) {
              throw "no licence file found for $repo; refusing to redistribute it"
            }
            if (-not (Get-ChildItem $dest -Filter "*.exe" -File)) {
              throw "$repo extracted no executable; a security product may have removed it"
            }

            Write-Output "  $repo $($rel.tag_name)  $($asset.name)  sha256=$sha"
            "$repo $($rel.tag_name) $($asset.name) sha256=$sha" |
              Add-Content -Path "$PWD/tools/VENDORED.txt" -Encoding utf8
          }

          New-Item -ItemType Directory -Force -Path "$PWD/tools" | Out-Null
          "Third-party tools redistributed in this build (both Apache-2.0):" |
            Set-Content -Path "$PWD/tools/VENDORED.txt" -Encoding utf8

          Get-Tool "mandiant/capa"        "$PWD/tools/capa"  "windows.*\.zip$"
          Get-Tool "mandiant/flare-floss" "$PWD/tools/floss" "windows.*\.zip$"

      - name: Build
        run: python -m PyInstaller ringforge.spec --noconfirm

      # ---------------------------------------------------------------------
      # Smoke tests against the frozen build, from outside the source tree.
      # ---------------------------------------------------------------------
      # These exist because the failure they cover is invisible from a
      # checkout. `app_root()` must resolve to the directory holding the
      # executable; every path derived from `__file__` instead lands in
      # `_internal/`, which holds no `tools/` and never will. Unfrozen the two
      # are the same directory, so the suite cannot tell them apart.
      - name: The CLI runs at all
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist/RingForge"
          & (Join-Path $dist "ringforge.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "ringforge.exe --help failed" }

      - name: tools/ resolves beside the executable, not inside the bundle
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist/RingForge"
          $rules = Join-Path $dist "tools/yara/rules"
          New-Item -ItemType Directory -Force -Path $rules | Out-Null

          # A rule that exists nowhere but beside the executable. If the scan
          # matches it, app_root() found it; if the rules directory were still
          # derived from __file__ the scan would see zero rules and report a
          # clean result, which is the exact defect this guards.
          $rule = "rule Beside_The_Executable { strings: `$a = " +
                  '"ringforge-frozen-probe"' + " condition: `$a }"
          Set-Content -Path (Join-Path $rules "beside_the_exe.yar") -Value $rule -Encoding utf8
          Set-Content -Path (Join-Path $dist "probe.bin") -Value "ringforge-frozen-probe" -NoNewline -Encoding utf8

          Push-Location $dist
          $out = & ./ringforge.exe scan probe.bin --case frozenprobe --json | ConvertFrom-Json
          Pop-Location

          $yara = $out.summary.yara
          if (-not $yara.matched) {
            throw "the frozen build did not find tools/ beside its executable"
          }
          if ($yara.top_rules -notcontains "Beside_The_Executable") {
            throw "matched something, but not the rule placed beside the exe"
          }
          Write-Output "  app_root resolves: matched $($yara.top_rules -join ', ')"

      - name: The verdict identifies the build that produced it
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist/RingForge"
          Push-Location $dist
          $v = & ./ringforge.exe combine cases/frozenprobe --json --no-write | ConvertFrom-Json
          Pop-Location

          $a = $v.provenance.analyzer
          # A frozen build has neither git history nor distribution metadata,
          # so both of these are stamped in at build time by ringforge.spec.
          # Null here means a verdict nobody can trace to a build.
          if (-not $a.version) { throw "provenance.analyzer.version is null in the frozen build" }
          if (-not $a.commit)  { throw "provenance.analyzer.commit is null in the frozen build" }

          # **A null library version is only a defect when the library is
          # actually in the bundle.** Two different things look the same in this
          # field: a library we ship whose metadata we forgot to collect -- which
          # is how `lief` was caught shipping as a bare `_lief.pyd`, reported
          # absent while sitting right there -- and a library that is simply not
          # installed, which is correct and is the posture the optional extras
          # document. The first must fail the build; the second must not.
          $internal = Join-Path $dist "_internal"
          $importName = @{
            "yara-python" = "yara"; "PyYAML" = "yaml"; "pillow" = "PIL"
            "pefile" = "pefile"; "psutil" = "psutil"; "requests" = "requests"
            "lief" = "lief"
          }
          foreach ($lib in $a.tools.PSObject.Properties) {
            if ($lib.Value) { continue }
            $module = $importName[$lib.Name]
            if (-not $module) { $module = $lib.Name }
            $shipped = Get-ChildItem $internal -Filter "$module*" -ErrorAction SilentlyContinue
            if ($shipped) {
              throw "$($lib.Name) is in the bundle but reports no version; its metadata was not collected"
            }
            Write-Output "  $($lib.Name): not installed, not bundled -- reported as absent, correctly"
          }
          Write-Output "  version $($a.version) commit $($a.commit)"

      # Only what the smoke tests made. `tools/` now holds the vendored capa
      # and FLOSS, so removing it wholesale -- as this step first did -- would
      # have quietly shipped a bundle with neither.
      - name: Clean the smoke-test leavings out of the bundle
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist/RingForge"
          Remove-Item -Recurse -Force (Join-Path $dist "tools/yara") -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $dist "cases") -ErrorAction SilentlyContinue
          Remove-Item -Force (Join-Path $dist "probe.bin") -ErrorAction SilentlyContinue

          foreach ($keep in @("tools/capa", "tools/floss")) {
            if (-not (Test-Path (Join-Path $dist $keep))) {
              throw "$keep is missing from the bundle after cleanup"
            }
          }
          Write-Output "  vendored tools intact"

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $zip = "RingForge-$version-win64.zip"
          Compress-Archive -Path dist/RingForge -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding utf8
          Write-Output "  $zip  $hash"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: RingForge-win64
          path: |
            ${{ env.zip }}
            ${{ env.zip }}.sha256

      # `gh` is preinstalled on the runner, so this needs no third-party action
      # in a repository whose whole subject is supply chain.
      #
      # Notes come from `docs/releases/<tag>.md` when it exists, so what gets
      # published is reviewable in the repository rather than re-drafted at
      # release time. The hash is appended here rather than written into that
      # file: PyInstaller is not byte-reproducible, so a hash committed
      # alongside the notes describes some other build.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = Join-Path $PWD "docs/releases/$tag.md"
          $ghArgs = @("$env:zip", "$($env:zip).sha256", "--title", $tag, "--verify-tag")

          if (Test-Path $notes) {
            $hash = (Get-Content "$($env:zip).sha256" -Raw).Trim()
            $body = Join-Path $env:RUNNER_TEMP "release-body.md"
            @(
              (Get-Content $notes -Raw),
              "",
              "---",
              "",
              "``````text",
              $hash,
              "``````"
            ) | Set-Content -Path $body -Encoding utf8
            Write-Output "  notes: docs/releases/$tag.md, with the built hash appended"
            $ghArgs += @("--notes-file", $body)
          } else {
            Write-Output "  notes: none in docs/releases/, falling back to generated"
            $ghArgs += "--generate-notes"
          }

          gh release create $tag @ghArgs
