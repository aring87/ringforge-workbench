# Packaging for RingForge Workbench.
#
# **Why this is not `requirements.txt`.** That file is a `pip freeze` of the
# bench: every transitive pin, plus PyInstaller and the scientific stack that
# only `scripts/` uses. It reproduces one machine. This declares what the
# *package* needs to import, which is a much smaller set, and lets the optional
# collectors stay optional -- each of them has a documented degradation path
# and "not installed" is a decision on record rather than a gap.
#
# Keep both. `pip install -e ".[dev]"` to work on the engine; `pip install -r
# requirements.txt` to reproduce the full bench including the emulator and the
# packaging toolchain.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringforge-workbench"
version = "1.12.0"
description = "Static, dynamic, API-spec and browser-extension triage with one corroboration-based verdict model"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# Dependency licences and the redistribution posture: THIRD-PARTY-NOTICES.md
authors = [{ name = "Adam Ring" }]
keywords = ["malware-analysis", "triage", "dfir", "yara", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# What the engine imports and cannot degrade without.
dependencies = [
    "pefile>=2023.2.7",
    "psutil>=6.1",
    "PyYAML>=6.0",
    "requests>=2.32",
    "yara-python>=4.5",
]

[project.optional-dependencies]
# Each of these has a working fallback in the code. They are extras so that a
# headless install stays small and so that a missing one keeps being a
# reportable coverage gap rather than an import error.
gui = ["pillow>=11"]
fuzzy = ["ssdeep", "tlsh"]          # needs a compiler on Windows
pdf = ["weasyprint"]                # else print the HTML report from a browser
progress = ["tqdm"]
emulation = ["unicorn", "capstone"] # scripts/ only: the native-stub emulator
dev = ["pytest>=8"]

[project.scripts]
# `ringforge` is the command line; `ringforge-gui` opens the workbench. That is
# the way round the convention expects, and it is what a pipeline or a SIEM
# exporter drives. `ringforge-scan` is kept as an alias for the one entry point
# that existed before the subcommands.
ringforge = "ringforge.cli:main"
ringforge-scan = "static_triage_engine.static_triage_cli:main"

[project.gui-scripts]
ringforge-gui = "gui.__main__:main"

[project.urls]
Documentation = "https://github.com/aring/ringforge-workbench/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
# Explicit, because flat layout with `assets/`, `docs/`, `tools/` and
# `test_specs/` beside the code makes auto-discovery ambiguous.
include = [
    "static_triage_engine*",
    "dynamic_analysis*",
    "verdict*",
    "gui*",
    "ringforge",
]

[tool.setuptools]
py-modules = ["design_tokens"]

[tool.setuptools.package-data]
"*" = ["*.pmc", "*.sig"]
