[pytest]
# `scripts/` holds two files named test_*.py that are not pytest tests --
# `test_emu_snapshot.py` and `test_dynamic_run.py` are manual CLI tools that
# take arguments and SystemExit on import without them, which aborts collection
# for the whole suite. They are documented under those names in docs/HANDOFF.md,
# so the collection root is narrowed rather than the tools renamed.
testpaths = dynamic_analysis/tests
