[pytest]
# `scripts/` holds two files named test_*.py that are not pytest tests --
# `test_emu_snapshot.py` and `test_dynamic_run.py` are manual CLI tools that
# take arguments and SystemExit on import without them, which aborts collection
# for the whole suite. They are documented under those names in docs/HANDOFF.md,
# so the collection root is narrowed rather than the tools renamed.
#
# `static_triage_engine/tests` was absent from this list, so its tests existed
# and never ran: a bare `pytest` collected only the dynamic suite. Two tests
# against 6,419 lines is thin enough already without them also being invisible.
testpaths =
    dynamic_analysis/tests
    static_triage_engine/tests

# `slow` covers tests that write a real minidump of the test process to check a
# dump parser against something the operating system produced rather than a
# fixture. Worth having and worth being able to skip: `pytest -m "not slow"`.
markers =
    slow: writes a real minidump; tens of seconds on a cold cache
