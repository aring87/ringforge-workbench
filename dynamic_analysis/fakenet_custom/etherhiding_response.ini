; Custom-response config for `0bw` phase 1 -- see docs/HANDOFF.md, entry 0bw.
;
; FakeNet resolves both this file and the `TcpDynamic` module relative to the
; directory holding the main config, which is why `make_fakenet_config.py`
; writes all three into one directory rather than leaving them in the clone.
;
; `InstanceName` matches the listener section the generator adds, so this
; applies to port 8545 only and nothing else on the bench changes behaviour.

[EtherHidingRPC]
InstanceName: EtherHidingRPC
TcpDynamic:   etherhiding_rpc.py
